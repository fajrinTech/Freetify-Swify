name: Build Freetify iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Xcode Archive
        run: |
          xcodebuild -project Freetify.xcodeproj \
            -scheme "Freetify v1" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Freetify.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r "build/Freetify.xcarchive/Products/Applications/Freetify v1.app" Payload/ || cp -r build/Freetify.xcarchive/Products/Applications/*.app Payload/
          zip -r Freetify-v1-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freetify-v1-Physical-Unsigned-IPA
          path: Freetify-v1-Unsigned.ipa
